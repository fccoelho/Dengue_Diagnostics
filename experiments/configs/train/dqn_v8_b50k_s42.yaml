# GERACAO v8 (mudanca de codigo, nao de parametro).
#
# "Nada" passou a ser nao fazer nada: o caso fica com o diagnostico do medico e
# NAO paga `penalty_unresolved`. So paga por ficar em aberto quem ABRIU
# investigacao (exame ou ida a campo) e nao a fechou. A penalidade tambem passou
# a ser cobrada NO PASSO em que o caso e largado, nao em bloco no fim.
#
# Efeito nos baselines: `clinical` foi de -4036,5 para -379,2 e passou a bater o
# `confirmall` (-1365,2). As politicas que concluem tudo nao mudaram.
#
# ATENCAO: `synthetic_v7.yaml` tem os mesmos parametros, mas roda com esta
# semantica agora — os resultados de dqn_v7_* nao sao reproduziveis com o codigo
# atual. Versionar por YAML nao captura mudanca de codigo.
#
# DQN v7 — PRIMEIRO treino no ambiente v7, com protocolo MULTI-SEED.
#
# Por que multi-seed (ver §15): rodar a melhor configuracao da sessao anterior
# com outro seed derrubou o resultado de -81,90 para -3272,25. Um espalhamento
# de 3190 pontos SEM mudar nada. Nenhuma conclusao tirada de execucao unica
# sobrevive a isso, entao daqui em diante toda comparacao sai com >= 3 seeds e
# se reporta media +- desvio.
#
# Braco de buffer: 50000 transicoes
# 50000 transicoes. So cabe por causa da reducao de §17: a 59 KB por
#   observacao isso custa 2,9 GB -- METADE do que as 6000 antigas custavam
#   (5,6 GB). Buffer maior e alavanca classica de estabilidade, e 6000 era
#   compromisso forcado, nao escolha.
#
# n_step mantido em 30: a §15 retirou a CONCLUSAO de que ele causou o salto do
# v13, mas o raciocinio que o motivou segue valido (a cadeia investigar ->
# laudo -> concluir tem ~30 passos) e o v14 mostrou que 60 quebra. E' escolha
# herdada, nao resultado estabelecido.
#
# reward_scale 0,10 verificado no v7: desvio por passo 10,19 -> 1,02 escalado.
#
env_config: ../env/synthetic_v7.yaml

context_features: true
reward_scale: 0.10

train:
  algorithm: dqn
  seed: 42
  epochs: 20
  step_per_epoch: 5000
  # <<< a mudanca: cobre a cadeia investigar -> laudo -> concluir
  n_step: 30
  batch_size: 64
  buffer_size: 50000
  test_buffer_per_env: 1000
  test_episodes: 20
  lr: 0.0001
  gamma: 0.99
  target_update_freq: 1000
  step_per_collect: 1000
  update_per_step: 0.1
  eps_train_start: 0.5
  eps_train_final: 0.05
  eps_train_decay: 20000
  eps_test: 0.01
  num_train_envs: 2
  num_test_envs: 2
  vector_env: dummy
  prefill_steps: 1000

output_dir: results/dqn_v8_b50k_s42

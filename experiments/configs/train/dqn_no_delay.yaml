# DQN sem delay de recompensa (recompensa imediata).
#
# Uso:
#   poetry run python agents/deepq/train.py --config experiments/configs/train/dqn_no_delay.yaml

env_config: ../env/synthetic_default.yaml

env:
  reward_delay_days: 0
  lab_delay_days: 0

train:
  algorithm: dqn
  seed: 42
  epochs: 50
  n_step: 1
  batch_size: 64
  # RAM ~= buffer_size * tamanho_do_mapa. Mapa 4x400x400 uint8 = 640 KB/obs:
  #   10000 -> ~6,4 GB | 20000 -> ~12,8 GB. Reduza se faltar RAM.
  buffer_size: 10000
  lr: 0.0001
  gamma: 0.99
  target_update_freq: 1000
  step_per_epoch: 10000
  step_per_collect: 1000
  update_per_step: 0.1
  eps_train_start: 1.0
  eps_train_final: 0.05
  eps_train_decay: 50000
  eps_test: 0.01
  num_train_envs: 2
  num_test_envs: 2
  vector_env: dummy
  prefill_steps: 1000

output_dir: results/dqn_no_delay

# Q-Learning tabular no ambiente v2 (RT-PCR + retorno do caso + exame caro).
#
# Mesmo ambiente do `dqn_v4.yaml`, para comparação direta.
#
# Nota sobre o estado: `rich_v1` já codifica o status dos exames do caso
# (`td`/`tc`), então o agente CONSEGUE distinguir a primeira avaliação de um
# retorno pós-laudo — é o que permite representar a política "testar e, quando o
# resultado chegar, confirmar".
#
# Assimetria a registrar no artigo: o DQN recebe também as features de contexto
# (estimativa da competência do médico), que não existem no estado tabular.
# Adicioná-las aqui multiplicaria o número de estados e provavelmente
# inviabilizaria a tabela — é uma limitação intrínseca da abordagem tabular, e
# vale como resultado.

env_config: ../env/synthetic_v2.yaml

state:
  version: rich_v1
  local_radius: 2
  day_early_max: 5
  day_mid_max: 15
  focus_near_frac: 0.12
  focus_mid_frac: 0.30

train:
  # Mais episódios que o padrão (200): o exame caro torna a decisão mais sutil.
  episodes: 400
  seed: 42
  alpha: 0.5
  gamma: 0.5
  epsilon_start: 0.30
  epsilon_final: 0.05
  epsilon_decay_episodes: 300
  day_bucket_size: 5
  save_every: 50
  log_every: 25

output_dir: results/qlearning_v2

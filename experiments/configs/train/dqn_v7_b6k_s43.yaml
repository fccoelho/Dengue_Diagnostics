# DQN v7 — PRIMEIRO treino no ambiente v7, com protocolo MULTI-SEED.
#
# Por que multi-seed (ver §15): rodar a melhor configuracao da sessao anterior
# com outro seed derrubou o resultado de -81,90 para -3272,25. Um espalhamento
# de 3190 pontos SEM mudar nada. Nenhuma conclusao tirada de execucao unica
# sobrevive a isso, entao daqui em diante toda comparacao sai com >= 3 seeds e
# se reporta media +- desvio.
#
# Braco de buffer: 6000 transicoes
# 6000 transicoes (~10 episodios). Valor historico, imposto pela RAM
#   quando a observacao tinha 938 KB. Serve de continuidade com o historico.
#
# n_step mantido em 30: a §15 retirou a CONCLUSAO de que ele causou o salto do
# v13, mas o raciocinio que o motivou segue valido (a cadeia investigar ->
# laudo -> concluir tem ~30 passos) e o v14 mostrou que 60 quebra. E' escolha
# herdada, nao resultado estabelecido.
#
# reward_scale 0,10 verificado no v7: desvio por passo 10,19 -> 1,02 escalado.
#
env_config: ../env/synthetic_v7.yaml

context_features: true
reward_scale: 0.10

train:
  algorithm: dqn
  seed: 43
  epochs: 20
  step_per_epoch: 5000
  # <<< a mudanca: cobre a cadeia investigar -> laudo -> concluir
  n_step: 30
  batch_size: 64
  buffer_size: 6000
  test_buffer_per_env: 1000
  test_episodes: 20
  lr: 0.0001
  gamma: 0.99
  target_update_freq: 1000
  step_per_collect: 1000
  update_per_step: 0.1
  eps_train_start: 0.5
  eps_train_final: 0.05
  eps_train_decay: 20000
  eps_test: 0.01
  num_train_envs: 2
  num_test_envs: 2
  vector_env: dummy
  prefill_steps: 1000

output_dir: results/dqn_v7_b6k_s43

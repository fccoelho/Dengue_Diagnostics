# DQN v11 — treina DIRETO no v3, do zero, testando tres correcoes estruturais
# que o diagnostico do v10 revelou:
#
# 1. `epi_confirm` era beco sem saida: adicionava evidencia epidemiologica mas
#    nao devolvia o caso ao agente (37% dos casos orfaos). Agora agenda revisita.
# 2. A mascara de decisao so disparava com os DOIS exames feitos; como o agente
#    nunca testava dengue, ela nunca ativava e o caso sumia ao esgotar revisitas
#    (52% dos orfaos). Agora tambem dispara na ULTIMA apresentacao.
#    -> orfaos: 35,7% -> 3,8%
# 3. A cabeca recebia 2304 dims de mapa contra 32 de contexto. Medido no modelo
#    treinado: ruido no mapa movia os Q-values em |dQ|~200-700 e invertia a
#    decisao; trocar o diagnostico DO PROPRIO CASO movia |dQ|~0-0,6 e nunca
#    mudava a acao. O agente ignorava a evidencia que pagou para obter (48,6%
#    das conclusoes contrariavam o diagnostico corrente, acertando so 20,7%).
#    Agora mapa->128 e contexto->128: o contexto passou de 1,3% para 40% da
#    entrada da cabeca.
#
# Sem currículo: o v10 mostrou que ele rende pouco (fase 2 ~= treino direto), e
# estas correcoes sao estruturais, nao de bootstrap.
#
env_config: ../env/synthetic_v3.yaml

context_features: true
reward_scale: 0.05

train:
  algorithm: dqn
  seed: 42
  epochs: 20
  step_per_epoch: 5000
  n_step: 5
  batch_size: 64
  buffer_size: 6000
  test_buffer_per_env: 1000
  test_episodes: 20
  lr: 0.0001
  gamma: 0.99
  target_update_freq: 1000
  step_per_collect: 1000
  update_per_step: 0.1
  # Fine-tuning: eps menor e decaindo mais rápido que a fase 1 (que começou do
  # zero com eps=1.0 por 50000 passos).
  eps_train_start: 0.5
  eps_train_final: 0.05
  eps_train_decay: 20000
  eps_test: 0.01
  num_train_envs: 2
  num_test_envs: 2
  vector_env: dummy
  prefill_steps: 1000

output_dir: results/dqn_v11

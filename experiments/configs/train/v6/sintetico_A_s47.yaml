# v7 — grupo sintetico, braço A, semente 47, 10 épocas. Gerado por experiments/fila.py.
env_config: ../../env/cenario_sintetico.yaml
context_features: true
reward_scale: 0.1
train:
  epochs: 10
  step_per_epoch: 30000
  step_per_collect: 2000
  repeat_per_collect: 10
  batch_size: 256
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  eps_clip: 0.2
  ent_coef: 0.02
  vf_coef: 0.5
  max_grad_norm: 0.5
  num_train_envs: 8
  num_test_envs: 10
  test_episodes: 20
  vector_env: dummy
  seed: 47
output_dir: results/ppo_v6/sintetico_A_s47

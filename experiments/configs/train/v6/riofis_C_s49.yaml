# v7 — grupo riofis, braço C, semente 49, 10 épocas. Gerado por experiments/fila.py.
env_config: ../../env/cenario_riofis.yaml
context_features: true
reward_scale: 0.1
train:
  epochs: 10
  step_per_epoch: 30000
  step_per_collect: 2000
  repeat_per_collect: 10
  batch_size: 256
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  eps_clip: 0.2
  ent_coef: 0.02
  vf_coef: 0.5
  max_grad_norm: 0.5
  num_train_envs: 8
  num_test_envs: 5
  test_episodes: 5
  vector_env: dummy
  seed: 49
  per_case_credit: true
output_dir: results/ppo_v6/riofis_C_s49

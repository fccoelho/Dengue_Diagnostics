# DQN no ambiente v3 — com casos que NÃO são arbovirose.
#
# Panorama do ambiente (10 seeds, exame a 4,0):
#   nada (clínico puro)                    -304,5  | acurácia 0,571 |   0 exames
#   confirmar sempre                      -1767,2  | acurácia 0,571 |   0 exames
#   1 exame -> confirmar                   -911,0  | acurácia 0,756 | 373 exames
#   2 exames -> conclui (melhor fixa)      +208,6  | acurácia 0,938 | 746 exames
#   [oráculo POR CASO]                    +2823,0  | acurácia 0,977 | 243 exames
#
# A margem de +2614 é o que o agente tem a capturar, e ela agora vem de
# discriminar QUAIS casos merecem investigação — não de escolher uma política
# fixa por episódio. O oráculo atinge acurácia MAIOR usando 67% MENOS exames,
# que é exatamente a tese do trabalho.
#
# Uso:
#   poetry run python agents/deepq/train.py --config experiments/configs/train/dqn_v5.yaml

env_config: ../env/synthetic_v3.yaml

context_features: true

# Reescala a recompensa só no treino (não altera a política ótima); mantém os
# alvos de TD numa escala tratável. Ver ACHADOS.md §6.8.
reward_scale: 0.05

train:
  algorithm: dqn
  seed: 42
  epochs: 20
  step_per_epoch: 5000
  n_step: 5
  batch_size: 64
  buffer_size: 6000
  test_buffer_per_env: 1000
  test_episodes: 20
  lr: 0.0001
  gamma: 0.99
  target_update_freq: 1000
  step_per_collect: 1000
  update_per_step: 0.1
  eps_train_start: 1.0
  eps_train_final: 0.05
  eps_train_decay: 50000
  eps_test: 0.01
  num_train_envs: 2
  num_test_envs: 2
  vector_env: dummy
  prefill_steps: 1000

output_dir: results/dqn_v5

# Treino Q-Learning sobre distribuição espacial Kriging (Rio).
#
# 1) Gere as superfícies (se ainda não existirem):
#    poetry run python -m dengue_envs.data.build_kriging_surfaces
# 2) Treine:
#    poetry run python agents/qlearning/train.py --config experiments/configs/train/qlearning_kriging.yaml

env_config: ../env/kriging_rio.yaml

state:
  version: rich_v1
  local_radius: 2
  day_early_max: 5
  day_mid_max: 15
  focus_near_frac: 0.12
  focus_mid_frac: 0.30

train:
  episodes: 200
  seed: 42
  alpha: 0.5
  gamma: 0.5
  epsilon_start: 0.30
  epsilon_final: 0.05
  epsilon_decay_episodes: 150
  day_bucket_size: 5
  save_every: 25
  log_every: 10

output_dir: results/qlearning_kriging

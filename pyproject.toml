[tool.poetry]
name = "dengue-diagnostics-env"
version = "0.1.0"
description = "This is a Gymnasium environment for learning optimal policies for acurately detecting dengue cases in the presence of other arbovirus cases such as chikungunya."
authors = ["Flavio Codeço Coelho <fccoelho@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "dengue_envs"}]

[tool.poetry.dependencies]
python = "<3.13,>=3.12"
gymnasium = "^0.29.1"
pygame = "^2.5.1"
scipy = "^1.11.2"
matplotlib = "^3.7.2"
pandas = "^2.1.1"
tensorboard = "^2.15.1"
tqdm = "^4.66.1"
notebook = "^7.3.2"
torch = { version = "*", source = "pytorch_cu130" }
torchvision = { version = "*", source = "pytorch_cu130" }
torchaudio = { version = "*", source = "pytorch_cu130" }
tianshou = "2.0.0b2"
geopandas = "^1.1.4"
pyogrio = "^0.13.0"
pykrige = "^1.7.3"
seaborn = "^0.13.2"
scikit-learn = "^1.9.0"
pymc = "^6.1.0"
arviz = "^1.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.1"
ipykernel = "^6.25.2"

[[tool.poetry.source]]
name = "pytorch_cu130"
url = "https://download.pytorch.org/whl/cu130"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
